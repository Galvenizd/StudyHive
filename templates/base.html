<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyHive{% endblock %}</title>
  <style>
    :root {
      --honey: #f5a524;
      --honey-dark: #c77d0a;
      --honey-soft: #fff4dc;
      --ink: #1f2328;
      --muted: #6b6f76;
      --line: #ece6da;
      --bg: #fbf8f2;
      --card: #ffffff;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
    }
    nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: 1rem; align-items: center;
      padding: .8rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 8px rgba(0,0,0,.04);
    }
    .brand {
      display: flex; align-items: center; gap: .5rem;
      margin-right: auto;
      font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em;
      color: var(--ink); text-decoration: none;
    }
    .brand svg { width: 28px; height: 28px; }
    .brand-name span { color: var(--honey-dark); }
    nav form { margin: 0; }
    main { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.9rem; letter-spacing: -.02em; margin: 0 0 1rem; }
    a { color: var(--honey-dark); }
    a:hover { color: var(--ink); }
    button, .btn {
      font: inherit; font-weight: 600; font-size: .9rem;
      padding: .45rem 1rem;
      border: 0; border-radius: 999px;
      background: var(--honey); color: var(--ink);
      cursor: pointer; text-decoration: none;
      transition: background .15s, transform .15s;
    }
    button:hover, .btn:hover { background: var(--honey-dark); color: #fff; }
    button:active, .btn:active { transform: translateY(1px); }
    .btn-ghost { background: transparent; border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--honey-soft); color: var(--ink); }
    .post {
      background: var(--card);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1rem 1.25rem; margin: 1rem 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.03);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="brand" href="{% url 'home' %}">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#f5a524"/>
        <polygon points="16,9 22,12.5 22,19.5 16,23 10,19.5 10,12.5" fill="#fff4dc"/>
      </svg>
      <span class="brand-name">Study<span>Hive</span></span>
    </a>
    {% if user.is_authenticated %}
      <span>Hi, {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn-ghost">Log out</button></form>
    {% else %}
      <a class="btn" href="{% url 'login' %}">Log in</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
